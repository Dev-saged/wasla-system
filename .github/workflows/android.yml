# يبني APK منظومة إدارة المخيمات (Android أصلي):
# - كل رفع: اختبارات + بناء موقّع + مطابقة بصمة الشهادة، والـAPK يُرفع Artifact فقط.
# - النشر Release يدوي فقط (publish) ومن main فقط، لأن Release الأخير يظهر
#   كتحديث عند كل مستخدمي النسخة المغلّفة القديمة.
# أسرار Actions المطلوبة: KEYSTORE_BASE64 (ملف p12 بترميز base64) و SIGNING_STORE_PASSWORD.
name: Build GRCS Android

on:
  push:
    branches: ['**']
    paths: ['android/**', 'docs/releases/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'نشر Release (يظهر تحديثاً لكل المستخدمين الحاليين)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # بصمة SHA-256 لشهادة التطبيق المثبّت حالياً؛ أي APK بغيرها لن يُثبَّت فوقه
  EXPECTED_CERT_SHA256: 82d0047d9251f146c9c0b5e3f9cc76aadcaa52b3306a76deb9458170c34acd90

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grcs-release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/grcs-release.p12" >> "$GITHUB_ENV"

      - name: Detect signing
        id: sign
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets — APK signed with a temporary key and cannot update the installed app."
          fi

      - name: Tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signing certificate
        if: steps.sign.outputs.signed == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "APK cert: $GOT"
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Certificate mismatch — this APK cannot update the installed app."; exit 1; }

      - name: Collect APK
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/GRCS-v${VERSION}-b${GITHUB_RUN_NUMBER}.apk"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRCS-APK-${{ github.run_number }}
          path: android/dist/GRCS-v*-b*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == 'main' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          NOTES="../docs/releases/v${VERSION}.md"
          [ -f "$NOTES" ] || { echo "::error::Missing $NOTES"; exit 1; }
          gh release create "$TAG" "dist/GRCS-${TAG}.apk" \
            --title "منظومة إدارة المخيمات ${VERSION}" \
            --notes-file "$NOTES" --target "$GITHUB_SHA" --latest
